<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MPOnline | Autonomous On-Screen Marking Portal</title>
    <meta name="description" content="State Level Digital Answer Sheet Evaluation, Allocation & Revaluation Portal" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <style>
      /* Universally hide all scrollbars (vertical & horizontal) across all browsers and elements */
      html, body, * {
        scrollbar-width: none !important;
        -ms-overflow-style: none !important;
      }
      *::-webkit-scrollbar {
        display: none !important;
        width: 0px !important;
        height: 0px !important;
        background: transparent !important;
      }
    </style>
  </head>
  <body>
    <!-- SVG Liquid Glass Filter for backdrop-filter url(#lg-filter) -->
    <svg style="position: fixed; top: 0; left: 0; width: 0; height: 0; pointer-events: none; opacity: 0; z-index: -9999;" aria-hidden="true">
      <defs>
        <filter id="lg-filter" x="-20%" y="-20%" width="140%" height="140%">
          <feTurbulence type="fractalNoise" baseFrequency="0.02 0.03" numOctaves="3" result="noise" />
          <feDisplacementMap in="SourceGraphic" in2="noise" scale="12" xChannelSelector="R" yChannelSelector="G" />
        </filter>
      </defs>
    </svg>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
